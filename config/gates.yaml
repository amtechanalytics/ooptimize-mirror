parse_floor: 0.85            # rolling (last 50) and per-stage
max_vendor_error_rate: 0.01  # cells still failing after retries; resume retries them
liveness:
  stall_minutes: 20           # no progress -> restart (long Java children touch the heartbeat every 60 s)
  batch_stall_minutes: 720    # while waiting on a vendor batch (OpenAI's window is 24 h)
  max_restarts_per_rung: 2
  executor_attempts: 2
  executor_timeout_minutes: 40
  executor_estimate_usd: 3.0
